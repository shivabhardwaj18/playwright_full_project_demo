name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mets_env:
        description: METS environment to run against
        required: true
        default: QA
        type: choice
        options:
          - DEV
          - QA
          - PP

jobs:
  test:
    name: Run tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      METS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.mets_env || 'QA' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests under tests
        run: npx playwright test tests

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
